<!DOCTYPE html>
<html>
<head>
  <title>User Activity Monitor</title>
  <style>
    body { font-family: Arial; }
    #log { border: 1px solid #000; height: 200px; overflow-y: auto; padding: 10px; }
    .warning { color: red; font-weight: bold; }
    button { margin-right: 10px; }
  </style>
</head>
<body>

<h2>📊 Real-Time User Activity Monitor</h2>

<input type="text" placeholder="Type here">
<button>Click Me</button>

<br><br>

<button onclick="exportLog()">Export Log</button>
<button onclick="resetLog()">Reset Log</button>

<p id="alert" class="warning"></p>

<div id="log"></div>

<script>
/* ---------- ACTIVITY STORAGE ---------- */
let activities = [];
let clickCount = 0;
const CLICK_LIMIT = 5;

/* ---------- LOG FUNCTION ---------- */
function logActivity(type, details, phase) {
  let entry = {
    event: type,
    details: details,
    phase: phase,
    time: new Date().toLocaleTimeString()
  };

  activities.push(entry);

  let logDiv = document.getElementById("log");
  logDiv.innerHTML += `${entry.time} | ${type} | ${details} | ${phase}<br>`;
  logDiv.scrollTop = logDiv.scrollHeight;
}

/* ---------- EVENT LISTENERS ---------- */

// Click – Bubbling
document.addEventListener("click", function (e) {
  clickCount++;
  logActivity("Click", e.target.tagName, "Bubbling");

  if (clickCount > CLICK_LIMIT) {
    document.getElementById("alert").textContent =
      "⚠ Suspicious Activity: Too many clicks!";
  }
}, false);

// Key press – Capturing
document.addEventListener("keydown", function (e) {
  logActivity("Key Press", e.key, "Capturing");
}, true);

// Focus – Bubbling
document.addEventListener("focusin", function (e) {
  logActivity("Focus", e.target.tagName, "Bubbling");
});

/* ---------- EXPORT LOG ---------- */
function exportLog() {
  let text = "USER ACTIVITY LOG\n\n";
  activities.forEach(a => {
    text += `${a.time} | ${a.event} | ${a.details} | ${a.phase}\n`;
  });
  alert(text);
}

/* ---------- RESET LOG ---------- */
function resetLog() {
  activities = [];
  clickCount = 0;
  document.getElementById("log").innerHTML = "";
  document.getElementById("alert").textContent = "";
}
</script>

</body>
</html>
