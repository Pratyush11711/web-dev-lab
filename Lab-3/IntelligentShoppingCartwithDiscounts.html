<!DOCTYPE html>
<html>
<head>
  <title>Intelligent Shopping Cart</title>
  <style>
    body { font-family: Arial; }
    table { border-collapse: collapse; width: 70%; }
    th, td { border: 1px solid #000; padding: 8px; text-align: center; }
    button { padding: 4px 8px; }
  </style>
</head>
<body>

<h2>🛒 Shopping Cart</h2>

<button onclick="addProduct()">Add Product</button>
<br><br>

Coupon Code:
<input type="text" id="coupon">
<button onclick="applyCoupon()">Apply</button>

<br><br>

<table>
  <thead>
    <tr>
      <th>Product</th>
      <th>Category</th>
      <th>Price</th>
      <th>Quantity</th>
      <th>Total</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="cartBody"></tbody>
</table>

<h3 id="grandTotal"></h3>

<script>
/* ---------------- PRODUCT ARRAY ---------------- */
let cart = [
  { name: "Laptop", price: 50000, quantity: 1, category: "Electronics" },
  { name: "Book", price: 500, quantity: 2, category: "Education" }
];

let couponDiscount = 0;

/* ---------------- ADD PRODUCT ---------------- */
function addProduct() {
  cart.push({ name: "Headphones", price: 2000, quantity: 1, category: "Electronics" });
  displayCart();
}

/* ---------------- REMOVE PRODUCT ---------------- */
function removeProduct(index) {
  cart.splice(index, 1);
  displayCart();
}

/* ---------------- UPDATE QUANTITY ---------------- */
function updateQty(index, qty) {
  cart[index].quantity = Number(qty);
  displayCart();
}

/* ---------------- DISCOUNT LOGIC ---------------- */
function calculateItemTotal(item) {
  let total = item.price * item.quantity;

  // Bulk discount (10% if quantity >= 3)
  if (item.quantity >= 3) {
    total *= 0.9;
  }

  // Category discount (Electronics 5%)
  if (item.category === "Electronics") {
    total *= 0.95;
  }

  return total;
}

/* ---------------- COUPON VALIDATION ---------------- */
function applyCoupon() {
  let code = document.getElementById("coupon").value.trim().toUpperCase();

  if (code.startsWith("SAVE")) {
    couponDiscount = 0.1; // 10%
    alert("Coupon Applied: 10% OFF");
  } else {
    couponDiscount = 0;
    alert("Invalid Coupon");
  }
  displayCart();
}

/* ---------------- TIME-BASED DISCOUNT ---------------- */
function timeDiscount(total) {
  let hour = new Date().getHours();
  if (hour >= 18 && hour <= 21) { // Evening discount
    total *= 0.95;
  }
  return total;
}

/* ---------------- DISPLAY CART ---------------- */
function displayCart() {
  let body = document.getElementById("cartBody");
  body.innerHTML = "";

  let grandTotal = 0;

  cart.forEach((item, index) => {
    let itemTotal = calculateItemTotal(item);
    grandTotal += itemTotal;

    body.innerHTML += `
      <tr>
        <td>${item.name}</td>
        <td>${item.category}</td>
        <td>₹${item.price}</td>
        <td>
          <input type="number" min="1" value="${item.quantity}"
                 onchange="updateQty(${index}, this.value)">
        </td>
        <td>₹${itemTotal.toFixed(2)}</td>
        <td><button onclick="removeProduct(${index})">Remove</button></td>
      </tr>
    `;
  });

  // Apply coupon discount
  grandTotal -= grandTotal * couponDiscount;

  // Apply time-based discount
  grandTotal = timeDiscount(grandTotal);

  document.getElementById("grandTotal").innerText =
    "Grand Total: ₹" + grandTotal.toFixed(2);
}

displayCart();
</script>

</body>
</html>
