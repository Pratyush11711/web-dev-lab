<!DOCTYPE html>
<html>
<head>
    <title>Product Inventory</title>
    <style>
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 5px; }
        .low-stock { background-color: #ffcccc; }
    </style>
</head>
<body>

<h2>Product Inventory System</h2>

<input type="text" id="searchCategory" placeholder="Search by Category">
<button onclick="searchProduct()">Search</button>

<form id="productForm">
    <input type="text" id="id" placeholder="Product ID" required>
    <input type="text" id="name" placeholder="Name" required>
    <input type="text" id="category" placeholder="Category" required>
    <input type="number" id="price" placeholder="Price" required>
    <input type="number" id="stock" placeholder="Stock" required>
    <button type="submit">Add Product</button>
</form>

<p id="msg"></p>
<p id="totalValue"></p>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="productTable"></tbody>
</table>

<script>
let products = [];

function loadProducts() {
    fetch("inventory.json")
        .then(res => res.json())
        .then(data => {
            products = data.products;
            displayProducts(products);
        });
}

function displayProducts(list) {
    const table = document.getElementById("productTable");
    table.innerHTML = "";
    let total = 0;

    list.forEach((product, index) => {
        total += product.price * product.stock;

        const rowClass = product.stock < 3 ? "low-stock" : "";

        table.innerHTML += `
            <tr class="${rowClass}">
                <td>${product.id}</td>
                <td>${product.name}</td>
                <td>${product.category}</td>
                <td>${product.price}</td>
                <td>${product.stock}</td>
                <td>
                    <button onclick="deleteProduct(${index})">Delete</button>
                </td>
            </tr>
        `;
    });

    document.getElementById("totalValue").textContent =
        "Total Inventory Value: ₹" + total;
}

document.getElementById("productForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const newProduct = {
        id: id.value,
        name: name.value,
        category: category.value,
        price: parseInt(price.value),
        stock: parseInt(stock.value)
    };

    products.push(newProduct);
    displayProducts(products);
    document.getElementById("msg").textContent = "Product Added";
    this.reset();
});

function deleteProduct(index) {
    products.splice(index, 1);
    displayProducts(products);
}

function searchProduct() {
    const category = document.getElementById("searchCategory").value.toLowerCase();

    const filtered = products.filter(product =>
        product.category.toLowerCase().includes(category)
    );

    displayProducts(filtered);
}

loadProducts();
</script>

</body>
</html>
