<!DOCTYPE html>
<html>
<head>
    <title>Library Tracker</title>
</head>
<body>

<h2>Library Book Tracker</h2>

<input type="text" id="bookId" placeholder="Book ID">
<input type="text" id="title" placeholder="Title">
<input type="text" id="author" placeholder="Author">
<button onclick="addBook()">Add Book</button>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="bookTable"></tbody>
</table>

<script>
let xmlDoc;

function loadBooks() {
    fetch("books.xml")
        .then(res => res.text())
        .then(data => {
            const parser = new DOMParser();
            xmlDoc = parser.parseFromString(data, "text/xml");
            displayBooks();
        });
}

function displayBooks() {
    const table = document.getElementById("bookTable");
    table.innerHTML = "";

    const books = xmlDoc.getElementsByTagName("book");

    for (let i = 0; i < books.length; i++) {
        const id = books[i].getElementsByTagName("id")[0].textContent;
        const title = books[i].getElementsByTagName("title")[0].textContent;
        const author = books[i].getElementsByTagName("author")[0].textContent;
        const status = books[i].getElementsByTagName("status")[0].textContent;

        table.innerHTML += `
            <tr>
                <td>${id}</td>
                <td>${title}</td>
                <td>${author}</td>
                <td>${status}</td>
                <td>
                    <button onclick="deleteBook(${i})">Delete</button>
                </td>
            </tr>
        `;
    }
}

function addBook() {

    if (!xmlDoc) {
        alert("XML not loaded yet!");
        return;
    }

    const bookIdInput = document.getElementById("bookId");
    const titleInput = document.getElementById("title");
    const authorInput = document.getElementById("author");

    if (!bookIdInput.value || !titleInput.value || !authorInput.value) {
        alert("All fields required!");
        return;
    }

    const book = xmlDoc.createElement("book");

    book.innerHTML = `
        <id>${bookIdInput.value}</id>
        <title>${titleInput.value}</title>
        <author>${authorInput.value}</author>
        <status>Available</status>
    `;

    xmlDoc.getElementsByTagName("books")[0].appendChild(book);

    displayBooks();

    bookIdInput.value = "";
    titleInput.value = "";
    authorInput.value = "";
}


function deleteBook(index) {
    const books = xmlDoc.getElementsByTagName("book");
    books[index].remove();
    displayBooks();
}

loadBooks();
</script>

</body>
</html>
