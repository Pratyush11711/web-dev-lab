<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>
    <style>
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 5px; }
    </style>
</head>
<body>

<h2>Student Management System</h2>

<form id="studentForm">
    <input type="text" id="id" placeholder="Student ID" required>
    <input type="text" id="name" placeholder="Name" required>
    <input type="text" id="dept" placeholder="Department" required>
    <input type="number" id="marks" placeholder="Marks" required>
    <button type="submit">Add Student</button>
</form>

<p id="msg"></p>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Dept</th>
            <th>Marks</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="studentTable"></tbody>
</table>

<script>
let students = [];

function loadStudents() {
    fetch("students.json")
        .then(res => res.json())
        .then(data => {
            students = data.students;
            displayStudents();
        });
}

function displayStudents() {
    const table = document.getElementById("studentTable");
    table.innerHTML = "";

    students.forEach((student, index) => {
        table.innerHTML += `
            <tr>
                <td>${student.id}</td>
                <td>${student.name}</td>
                <td>${student.dept}</td>
                <td>${student.marks}</td>
                <td>
                    <button onclick="editStudent(${index})">Edit</button>
                    <button onclick="deleteStudent(${index})">Delete</button>
                </td>
            </tr>
        `;
    });
}

document.getElementById("studentForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const newStudent = {
        id: document.getElementById("id").value,
        name: document.getElementById("name").value,
        dept: document.getElementById("dept").value,
        marks: document.getElementById("marks").value
    };

    students.push(newStudent);
    displayStudents();

    document.getElementById("msg").textContent = "Student Added Successfully (200)";
    this.reset();
});

function deleteStudent(index) {
    students.splice(index, 1);
    displayStudents();
    document.getElementById("msg").textContent = "Student Deleted (200)";
}

function editStudent(index) {
    const student = students[index];
    id.value = student.id;
    name.value = student.name;
    dept.value = student.dept;
    marks.value = student.marks;

    students.splice(index, 1);
    displayStudents();
}

loadStudents();
</script>

</body>
</html>
